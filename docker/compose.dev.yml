# PostgreSQL for local development (started by "make dev").
# Port 5434 avoids clashing with another local PostgreSQL on 5432.
name: ronde-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ronde
      POSTGRES_PASSWORD: ronde
      POSTGRES_DB: ronde
    ports: ["127.0.0.1:5434:5432"]
    volumes: [ronde-dev-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronde -d ronde"]
      interval: 2s
      timeout: 5s
      retries: 30

  mail:
    image: axllent/mailpit:latest
    profiles: [mail]
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  ronde-dev-pgdata:
