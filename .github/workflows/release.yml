name: Release

# Ronde is in beta: a beta is published by hand, from Actions › Release › Run workflow. It takes the next number
# after the betas already published (v1.0.0-beta.1, beta.2…), tags the commit of main, writes a GitHub
# pre-release listing the changes since the previous beta, then builds the images for amd64 and arm64 and pushes
# them to GHCR with that version and the "beta" tag, never "latest". release.config.mjs (semantic-release) takes
# over for the stable versions.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Version the betas lead to
        default: "1.0.0"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history and its tags: the notes list the commits since the previous beta
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next beta
        id: version
        env:
          BASE: ${{ inputs.base }}
        run: |
          [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version expected like 1.0.0, got $BASE"; exit 1; }
          last=$(git ls-remote --tags origin "refs/tags/v${BASE}-beta.*" | grep -v '\^{}' | sed -E 's#.*-beta\.([0-9]+)$#\1#' | sort -n | tail -1)
          echo "version=${BASE}-beta.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
      - name: Tag and pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The changes since the previous beta; the first one tells the whole story (the first commit's message)
          prev=$(git tag -l "v*-beta.*" --sort=-v:refname | head -1)
          if [ -n "$prev" ]; then
            git log --reverse --no-merges --format='- %s' "$prev..$GITHUB_SHA" > notes.md
          else
            root=$(git rev-list --max-parents=0 "$GITHUB_SHA" | tail -1)
            { git log -1 --format=%B "$root"; git log --reverse --no-merges --format='- %s' "$root..$GITHUB_SHA"; } > notes.md
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease --title "v$VERSION" --notes-file notes.md

  images:
    name: Images
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    # Two platforms, arm64 under emulation: about 30 minutes; a hang fails here instead of after 6 hours
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - target: web
            image: ghcr.io/joinronde/ronde
            pure_ce: ""
          - target: web
            image: ghcr.io/joinronde/ronde-ce
            pure_ce: "1"
          - target: migrate
            image: ghcr.io/joinronde/ronde-migrate
            pure_ce: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            RONDE_PURE_CE=${{ matrix.pure_ce }}
          tags: |
            ${{ matrix.image }}:${{ needs.release.outputs.version }}
            ${{ matrix.image }}:beta
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
