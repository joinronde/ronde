name: Release

# Ronde is in beta: a beta is published by hand, from Actions › Release › Run workflow. It takes the next number
# after the betas already published (v1.0.0-beta.1, beta.2…), tags the commit of main, writes a GitHub
# pre-release listing the changes since the previous beta, then builds the images for amd64 and arm64 (each on a
# runner of its own kind) and pushes them to GHCR with that version and the "beta" tag, never "latest".
# release.config.mjs (semantic-release) takes over for the stable versions.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Version the betas lead to
        default: "1.0.0"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history and its tags: the notes list the commits since the previous beta
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next beta
        id: version
        env:
          BASE: ${{ inputs.base }}
        run: |
          [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version expected like 1.0.0, got $BASE"; exit 1; }
          last=$(git ls-remote --tags origin "refs/tags/v${BASE}-beta.*" | grep -v '\^{}' | sed -E 's#.*-beta\.([0-9]+)$#\1#' | sort -n | tail -1)
          echo "version=${BASE}-beta.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
      - name: Tag and pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The changes since the previous beta; the first one tells the whole story (the first commit's message)
          prev=$(git tag -l "v*-beta.*" --sort=-v:refname | head -1)
          if [ -n "$prev" ]; then
            git log --reverse --no-merges --format='- %s' "$prev..$GITHUB_SHA" > notes.md
          else
            root=$(git rev-list --max-parents=0 "$GITHUB_SHA" | tail -1)
            { git log -1 --format=%B "$root"; git log --reverse --no-merges --format='- %s' "$root..$GITHUB_SHA"; } > notes.md
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease --title "v$VERSION" --notes-file notes.md

  images:
    name: Images
    needs: release
    if: needs.release.outputs.version != ''
    # Each platform on a runner of its own kind: arm64 no longer built under QEMU emulation, where Node crashed
    # (qemu: uncaught target signal 4, Illegal instruction) and hung the build until its time limit
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # A hang fails here instead of after 6 hours
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [ronde, ronde-ce, ronde-migrate]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: ronde
            target: web
            pure_ce: ""
          - image: ronde-ce
            target: web
            pure_ce: "1"
          - image: ronde-migrate
            target: migrate
            pure_ce: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Platform
        id: platform
        run: echo "pair=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_OUTPUT"
      # Pushed by its digest only: the merge job below names the two platforms' digests as one image
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            RONDE_PURE_CE=${{ matrix.pure_ce }}
          outputs: type=image,name=ghcr.io/joinronde/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.platform.outputs.pair }}
      - name: Keep the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ steps.platform.outputs.pair }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Manifests
    needs: [release, images]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ronde, ronde-ce, ronde-migrate]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The two platforms under one name: the version, and "beta" (never "latest")
      - name: Tag the image
        working-directory: digests
        env:
          IMAGE: ghcr.io/joinronde/${{ matrix.image }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # One argument per platform's digest: split on purpose
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:beta" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
