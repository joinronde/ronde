name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ronde
          POSTGRES_PASSWORD: ronde
          POSTGRES_DB: ronde
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ronde -d ronde"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ronde:ronde@localhost:5432/ronde
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:english
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply migrations to an empty database
        run: pnpm --filter @ronde/db db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - name: Pure Community build (no paid code)
        run: pnpm build:ce
      - name: Smoke test the standalone server
        working-directory: apps/web
        run: |
          cp -r public .next/standalone/apps/web/
          cp -r .next/static .next/standalone/apps/web/.next/
          PORT=3999 node .next/standalone/apps/web/server.js &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3999/api/health && exit 0; sleep 1; done
          exit 1

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ronde
          POSTGRES_PASSWORD: ronde
          POSTGRES_DB: ronde
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ronde -d ronde"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ronde:ronde@localhost:5432/ronde
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ronde/db db:generate
      - run: pnpm --filter @ronde/db db:migrate
      - run: pnpm --filter @ronde/web exec playwright install --with-deps chromium
      # The production build answers fast and steadily: a dev server compiling every page under several
      # browsers at once falls behind and drops connections
      - run: pnpm --filter @ronde/web build
      - run: pnpm --filter @ronde/web e2e --workers=1
        env:
          E2E_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  compose:
    name: Self-hosting (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the images as the release does
        uses: docker/bake-action@v5
        with:
          source: .
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
          files: docker/docker-bake.hcl
      - name: Start the stack of the self-hosting guide
        working-directory: docker
        run: |
          cat > .env <<ENV
          RONDE_URL=http://localhost:3000
          RONDE_VERSION=ci
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          AUTH_SECRET=$(openssl rand -base64 32)
          SECRET_KEY=$(openssl rand -base64 32)
          ENV
          docker compose up -d
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:3000/api/health && exit 0; sleep 2; done
          docker compose logs
          exit 1
      - name: Stop it
        if: always()
        working-directory: docker
        run: docker compose down -v
