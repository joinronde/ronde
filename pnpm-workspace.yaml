packages:
  - apps/*
  - packages/*
  - ee
  - ee-stub

onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - prisma

# Every Tiptap package at the editor's version (the React binding's optional menus would otherwise float ahead)
overrides:
  "@tiptap/extension-bubble-menu": 3.31.3
  "@tiptap/extension-floating-menu": 3.31.3
  # Pulled in by Better Auth for MySQL, which Ronde does not use: kept at a version without known flaws
  mysql2: 3.24.4
  # Advisories on transitive dependencies that their parents' ranges kept on the flawed versions (pnpm audit, Nov 2026):
  # they come with Prisma, imapflow and Better Auth SSO (vite, a peer of vitest, is a root devDependency)
  deepmerge-ts: ^8.0.2
  effect: ^3.22.1
  fast-uri: ^3.1.9
  fast-xml-parser: ^5.12.0
  ip-address: ^10.7.4
